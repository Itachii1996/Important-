<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ankita 💖</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Poppins', sans-serif;
    text-align: center;
  }

  .card {
    background: white;
    padding: 28px 20px;
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    max-width: 90%;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 18px;
    color: #ff4d6d;
  }

  p {
    font-size: 1.1rem;
    color: #444;
  }

  button {
    padding: 14px 30px;
    font-size: 1.1rem;
    border: none;
    border-radius: 30px;
    margin: 10px;
    cursor: pointer;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    animation: pulse 1.4s infinite;
  }

  #no {
    background: #aaa;
    color: white;
    position: absolute;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: float 6s linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }
</style>
</head>

<body onclick="startMusic()">

<audio id="music" loop>
  <source src="dooron-dooron.mp3" type="audio/mp3">
</audio>

<div class="card">
  <h1>Ankita 💕<br>Will you be my Valentine?</h1>

  <button id="yes" onclick="yesClicked()">YES 💖</button>
  <button id="no">NO 😢</button>
</div>

<script>
  const noBtn = document.getElementById("no");

  function moveNo() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  function yesClicked() {
    document.body.innerHTML = `
      <div class="card">
        <h1>YAYYYY 🥹❤️</h1>
        <p>Ankita 💕<br>
        You just made me the happiest person alive.<br>
        This Valentine’s Day is ours 💖</p>
      </div>
    `;
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }

  setInterval(createHeart, 300);

  function startMusic() {
    document.getElementById("music").play();
  }
</script>

</body>
</html>
